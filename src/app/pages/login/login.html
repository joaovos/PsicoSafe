<div class="login-container">
  <div class="login-card">
    <div class="header">
      <h2>PsicoSafe</h2>
    </div>

    <form (ngSubmit)="onSubmit()">
      <div *ngIf="isModoCadastro" class="form-group">
        <label>Nome Completo</label>
        <input type="text" [(ngModel)]="nome" name="nome" placeholder="Nome do Profissional" required>
      </div>

      <div class="form-group">
        <label>E-mail</label>
        <input type="email" [(ngModel)]="email" name="email" placeholder="psicologo@email.com" required>
      </div>

      <div *ngIf="isModoCadastro" class="form-group">
        <label>Registro CRP</label>
        <input type="text" [(ngModel)]="crp" name="crp" placeholder="CRP 00/00000" required>
      </div>

      <div class="form-group">
        <label>Senha</label>
        <input type="password" [(ngModel)]="senha" name="senha" placeholder="••••••••" required>
      </div>

      <div *ngIf="mensagemErro" class="erro-mensagem">
        {{ mensagemErro }}
      </div>

      <button type="submit" class="btn-primary">
        {{ isModoCadastro ? 'Cadastrar' : 'Entrar no Sistema' }}
      </button>
    </form>

    <div class="footer">
      <button (click)="alternarModo()" class="btn-link">
        {{ isModoCadastro ? 'Já tem conta? Faça Login' : 'Não tem conta? Cadastre-se' }}
      </button>
    </div>
  </div>
</div>
